[target.xtensa-esp32s3-none-elf]
runner = "probe-rs run --disable-progressbars --chip=esp32s3 --preverify --always-print-stacktrace --no-location"

[env]
DEFMT_LOG = "info"

[build]
rustflags = [
  "-C", "link-arg=-nostartfiles",
  "-Z", "stack-protector=all",
  "-C", "link-arg=-Wl,--no-warn-rwx-segments",
]

target = "xtensa-esp32s3-none-elf"

[unstable]
build-std = ["alloc", "core"]
