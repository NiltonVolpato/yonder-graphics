[workspace]
resolver = "3"
members = ["api", "gallery", "geometry", "raster"]
exclude = ["esp32"]

[workspace.dependencies]
yonder-geometry = { path = "geometry" }
yonder-raster = { path = "raster" }
yonder-graphics = { path = "api" }

[profile.bench]
opt-level        = 3
codegen-units    = 1
debug            = "full"
split-debuginfo  = "packed"
lto              = "fat"

[profile.release]
opt-level        = 3
codegen-units    = 1
debug            = "full"
split-debuginfo  = "packed"
lto              = "fat"
